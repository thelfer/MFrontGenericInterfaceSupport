name: CI with TFEL support on Ubuntu on Mac Os

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
          - os: macos-latest
            jobs_flag: '-j $(sysctl -n hw.ncpu)'
            fortran_support: 'OFF'

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout TFEL
      uses: actions/checkout@v7
      with:
        repository: thelfer/tfel
        path: tfel

    - name: Checkout MGIS
      uses: actions/checkout@v7
      with:
        path: mgis

    - name: Install TFEL
      run: |
        cmake  ${{github.workspace}}/tfel                               \
               -B ${{github.workspace}}/build-tfel                      \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}                    \
              -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install-tfel
        cmake --build ${{github.workspace}}/build-tfel --target all ${{ matrix.jobs_flag }}
        cmake --build ${{github.workspace}}/build-tfel --target install

    - name: Configure
      run: |
        source ${{github.workspace}}/install-tfel/share/tfel/env/env.sh
        cmake ${{github.workspace}}/mgis                                     \
              -B ${{github.workspace}}/build                                 \
              -DCMAKE_BUILD_TYPE=Release                                     \
              -Denable-c-bindings=ON                                         \
              -Denable-fortran-bindings=${{ matrix.fortran_support }}        \
              -Denable-python-bindings=OFF                                   \
              -Denable-portable-build=ON                                     \
              -Denable-julia-bindings=OFF                                    \
              -DTFEL_DIR=${{github.workspace}}/install-tfel/share/tfel/cmake \
              -Denable-parallel-stl-algorithms=OFF

    - name: Compile
      run: |
        source ${{github.workspace}}/install-tfel/share/tfel/env/env.sh
        cmake --build ${{github.workspace}}/build --target all ${{ matrix.jobs_flag }}

    - name: Test
      run: |
        source ${{github.workspace}}/install-tfel/share/tfel/env/env.sh
        cmake --build ${{github.workspace}}/build --target check ${{ matrix.jobs_flag }}

    - name: Print test log on failure
      if: failure()
      run: |
        cat ${{github.workspace}}/build/Testing/Temporary/*.log

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/tests/*.xml'
