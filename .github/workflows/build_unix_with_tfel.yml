name: CI with TFEL support on Ubuntu on Mac Os

on:
  push:
    branches: [ "rliv-2.1" ]
  pull_request:
    branches: [ "rliv-2.1" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout TFEL
      uses: actions/checkout@v7
      with:
        repository: thelfer/tfel
        ref: rliv-4.1
        path: tfel

    - name: Checkout MGIS
      uses: actions/checkout@v7
      with:
        path: mgis

    - name: Install TFEL
      run: |
        cmake  ${{github.workspace}}/tfel                               \
               -B ${{github.workspace}}/build-tfel                      \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}                    \
              -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install-tfel
        cmake --build ${{github.workspace}}/build-tfel --target all ${{ matrix.jobs_flag }}
        cmake --build ${{github.workspace}}/build-tfel --target install

    - name: Configure
      run: |
        export TFELHOME=${{github.workspace}}/install-tfel
        export PATH=$TFELHOME/bin:$PATH
        export LD_LIBRARY_PATH=$TFELHOME/lib:$LD_LIBRARY_PATH
        cmake ${{github.workspace}}/mgis                              \
              -B ${{github.workspace}}/build                          \
              -DCMAKE_BUILD_TYPE=Release                              \
              -Denable-c-bindings=ON                                  \
              -Denable-fortran-bindings=${{ matrix.fortran_support }} \
              -Denable-python-bindings=OFF                            \
              -Denable-portable-build=ON                              \
              -Denable-julia-bindings=OFF

    - name: Compile
      run: |
        export TFELHOME=${{github.workspace}}/install-tfel
        export PATH=$TFELHOME/bin:$PATH
        export LD_LIBRARY_PATH=$TFELHOME/lib:$LD_LIBRARY_PATH
        cmake --build ${{github.workspace}}/build --target all ${{ matrix.jobs_flag }}

    - name: Test
      run: |
        export TFELHOME=${{github.workspace}}/install-tfel
        export PATH=$TFELHOME/bin:$PATH
        export LD_LIBRARY_PATH=$TFELHOME/lib:$LD_LIBRARY_PATH
        cmake --build ${{github.workspace}}/build --target check ${{ matrix.jobs_flag }}

    - name: Print test log on failure
      if: failure()
      run: |
        cat ${{github.workspace}}/build/Testing/Temporary/*.log

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/tests/*.xml'
