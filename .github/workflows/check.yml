# TFEL is built from source by Spack: unlike master, this branch has no binary cache.
name: CI with TFEL support on Ubuntu and MacOS (spack)

on:
  push:
    branches: [ "rliv-1.2" ]
  pull_request:
    branches: [ "rliv-1.2" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
            python_support: 'ON'
          - os: macos-latest
            jobs_flag: '-j $(sysctl -n hw.ncpu)'
            fortran_support: 'OFF'
            python_support: 'OFF'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Spack
      uses: spack/setup-spack@v3
      with:
        spack_ref: v1.2.2      # Spack version
        packages_ref: develop  # Spack packages (builtin repository) version
        buildcache: false      # no binary cache on this branch
        color: true            # Force color output (SPACK_COLOR=always)
        spack_path: ${{github.workspace}}/spack       # Where to clone Spack

    # packages installed out of the source tree
    - name: Set up the install tree
      run: spack config add "config:install_tree:root:${{ runner.temp }}/spack-opt"

    - name: Install TFEL
      shell: spack-sh {0}
      run: |
        spack install tfel@rliv-3.4 ~python~python_bindings~aster~fortran~abaqus~calculix~ansys~europlexus~cyrano~lsdyna~comsol~diana-fea

    # the packages of the system, as in the workflows without TFEL: with TFEL, make check
    # also runs the tests of the Python bindings
    - name: Install numpy and boost/python
      if: matrix.python_support == 'ON'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpython3-dev python3-numpy libboost-python-dev

    - name: cmake
      shell: spack-sh {0}
      run: |
        # loading TFEL
        spack load tfel
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -Denable-c-bindings=ON                                  \
              -Denable-fortran-bindings=${{ matrix.fortran_support }} \
              -Denable-python-bindings=${{ matrix.python_support }}   \
              -Denable-portable-build=ON                              \
              -Denable-julia-bindings=OFF
    - name: make
      shell: spack-sh {0}
      run: |
        spack load tfel
        make -C build ${{ matrix.jobs_flag }}
    - name: make check
      shell: spack-sh {0}
      run: |
        spack load tfel
        make -C build check ${{ matrix.jobs_flag }}
