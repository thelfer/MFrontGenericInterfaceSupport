# TFEL is built from source by Spack: unlike master, this branch has no binary cache.
name: CI with TFEL support on Ubuntu and MacOS (spack)

on:
  push:
    branches: [ "rliv-3.1" ]
  pull_request:
    branches: [ "rliv-3.1" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
            python_support: 'ON'
            julia_support: 'ON'
          # the only build that compiles the code of MGIS_DEBUG
          - os: ubuntu-latest
            build_type: Debug
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
            python_support: 'ON'
          # errors reported by exceptions (#283). The build type differs from the
          # one of the matrix so that this entry adds a job instead of completing
          # the Release one
          - os: ubuntu-latest
            build_type: RelWithDebInfo
            enable_exceptions: 'ON'
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
            python_support: 'ON'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Spack
      uses: spack/setup-spack@v3
      with:
        spack_ref: v1.2.2      # Spack version
        packages_ref: develop  # Spack packages (builtin repository) version
        buildcache: false      # no binary cache on this branch
        color: true            # Force color output (SPACK_COLOR=always)
        spack_path: ${{github.workspace}}/spack       # Where to clone Spack

    # packages installed out of the source tree
    - name: Set up the install tree
      run: spack config add "config:install_tree:root:${{ runner.temp }}/spack-opt"

    - name: Install TFEL
      shell: spack-sh {0}
      run: |
        spack install tfel@rliv-5.1 ~python~python_bindings~aster~fortran~abaqus~calculix~ansys~europlexus~cyrano~lsdyna~comsol~diana-fea

    # the packages of the system, as in the workflows without TFEL: with TFEL, make check
    # also runs the tests of the Python bindings
    - name: Install numpy and pybind11
      if: matrix.python_support == 'ON'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpython3-dev python3-numpy pybind11-dev

    # with TFEL, make check also runs the tests of the Julia bindings
    - name: Set up Julia
      if: matrix.julia_support == 'ON'
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.13'
    # the bindings are compiled against the libcxxwrap-julia of the CxxWrap package,
    # which the tests load
    - name: Install CxxWrap
      if: matrix.julia_support == 'ON'
      run: |
        julia -e 'using Pkg; Pkg.add(name="CxxWrap", version="0.17.5")'
        echo "JlCxx_ROOT=$(julia -e 'using CxxWrap; print(CxxWrap.prefix_path())')" >> $GITHUB_ENV

    - name: cmake
      shell: spack-sh {0}
      run: |
        # loading TFEL
        spack load tfel
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}    \
              -Denable-c-bindings=ON                                       \
              -Denable-exceptions=${{ matrix.enable_exceptions || 'OFF' }} \
              -Denable-fortran-bindings=${{ matrix.fortran_support }}      \
              -Denable-python-bindings=${{ matrix.python_support }}        \
              -Denable-portable-build=ON                                   \
              -Denable-julia-bindings=${{ matrix.julia_support || 'OFF' }} \
              -DTFEL_DIR=`spack location -i tfel`/share/tfel/cmake         \
              -Denable-parallel-stl-algorithms=OFF
    - name: make
      shell: spack-sh {0}
      run: |
        spack load tfel
        make -C build ${{ matrix.jobs_flag }}
    - name: make check
      shell: spack-sh {0}
      run: |
        spack load tfel
        make -C build check ${{ matrix.jobs_flag }}
