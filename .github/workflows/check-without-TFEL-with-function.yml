name: CI without TFEL support with MGIS/Function on Ubuntu

on:
  push:
    branches: [ "rliv-3.1" ]
  pull_request:
    branches: [ "rliv-3.1" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install numpy and pybind11
      run: |
        sudo apt update
        sudo apt upgrade
        sudo apt install -y libpython3-dev python3-numpy pybind11-dev

    - name: cmake
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release .         \
              -Denable-c-bindings=ON               \
              -Denable-fortran-bindings=ON         \
              -Denable-python-bindings=On          \
              -Denable-portable-build=ON           \
              -Denable-static=ON                   \
              -Denable-openmp=ON                   \
              -Denable-julia-bindings=OFF          \
              -Denable-parallel-stl-algorithms=OFF

    - name: make
      run: |
        make

    - name: make check
      run: |
        make check
