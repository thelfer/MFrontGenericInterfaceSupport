name: CI without TFEL support with MGIS/Function on Ubuntu

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    - name: Install numpy and pybind11
      run: |
        sudo apt update
        sudo apt upgrade
        sudo apt install -y libhdf5-dev libpython3-dev python3-numpy pybind11-dev

    steps:
    - uses: actions/checkout@v4
    - name: cmake
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release .                         \
              -Denable-c-bindings=ON                               \
              -Denable-fortran-bindings=ON                         \
              -Denable-python-bindings=On                          \
              -Denable-portable-build=ON                           \
              -Denable-julia-bindings=OFF                          \
              -Denable-parallel-stl-algorithms=OFF
    - name: make
      run: |
        make
    - name: make check
      run: |
        make check
