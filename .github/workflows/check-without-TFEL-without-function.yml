name: CI without TFEL without mgis-function support on Ubuntu

on:
  push:
    branches: [ "rliv-3.0" ]
  pull_request:
    branches: [ "rliv-3.0" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install numpy and pybind11
      run: |
        sudo apt update
        sudo apt upgrade
        sudo apt install -y libpython3-dev python3-numpy pybind11-dev

    - name: cmake
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release . \
              -Denable-c-bindings=ON       \
              -Denable-fortran-bindings=ON \
              -Denable-python-bindings=On  \
              -Denable-pybind11=ON         \
              -Denable-portable-build=ON   \
              -Denable-julia-bindings=OFF

    - name: make
      run: |
        make

    - name: make check
      run: |
        make check
