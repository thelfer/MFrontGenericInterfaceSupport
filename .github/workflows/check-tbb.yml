# TFEL and TBB are built from source by Spack: unlike master, this branch has no
# binary cache.
name: CI with TFEL and TBB support on Linux and MacOs (spack)

on:
  push:
    branches: [ "rliv-3.1" ]
  pull_request:
    branches: [ "rliv-3.1" ]

# without cache, a run is long: a new push cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            jobs_flag: '-j $(nproc)'
            fortran_support: 'ON'
          - os: macos-latest
            jobs_flag: '-j $(sysctl -n hw.ncpu)'
            fortran_support: 'OFF'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Spack
      uses: spack/setup-spack@v3
      with:
        spack_ref: v1.2.2      # Spack version
        packages_ref: develop  # Spack packages (builtin repository) version
        buildcache: false      # no binary cache on this branch
        color: true            # Force color output (SPACK_COLOR=always)
        spack_path: ${{github.workspace}}/spack       # Where to clone Spack

    - name: Install TFEL
      shell: spack-sh {0}
      run: |
        # intel-tbb@2023.2.0 (spack-packages, 2026-10-29) does not build on
        # macOS: its thread composability manager passes --version-script
        # to the Apple linker
        spack install intel-tbb@2023.1.0
        spack install tfel@rliv-5.1 ~python~python_bindings~aster~fortran~abaqus~calculix~ansys~europlexus~cyrano~lsdyna~comsol~diana-fea

    - name: cmake
      shell: spack-sh {0}
      run: |
        # loading TFEL
        spack load tfel
        spack load intel-tbb
        cmake -DCMAKE_BUILD_TYPE=Release .                            \
              -Denable-c-bindings=ON                                  \
              -Denable-fortran-bindings=${{ matrix.fortran_support }} \
              -Denable-python-bindings=OFF                            \
              -Denable-portable-build=ON                              \
              -Denable-julia-bindings=OFF                             \
              -DTFEL_DIR=`spack location -i tfel`/share/tfel/cmake    \
              -Denable-parallel-stl-algorithms=ON
    - name: make
      shell: spack-sh {0}
      run: |
        spack load tfel
        spack load intel-tbb
        make ${{ matrix.jobs_flag }}
    - name: make check
      shell: spack-sh {0}
      run: |
        spack load tfel
        spack load intel-tbb
        make check ${{ matrix.jobs_flag }}
